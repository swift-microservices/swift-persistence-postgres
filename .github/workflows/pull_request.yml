name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.15
    with:
      api_breakage_check_enabled: false
      license_header_check_enabled: true
      docs_check_targets: "PersistencePostgres"

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  static-sdk:
    name: Static Linux Swift SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@main
    with:
      command_arguments: "--swift-sdk x86_64-swift-linux-musl"

  # SwiftNIO shares a concurrency group across static SDK calls.
  static-sdk-arm64:
    name: Static Linux Swift SDK ARM64
    needs: static-sdk
    if: ${{ !cancelled() }}
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@main
    with:
      command_arguments: "--swift-sdk aarch64-swift-linux-musl"

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@main
    with:
      minimum_swift_version: "6.3"
      linux_6_2_enabled: false
