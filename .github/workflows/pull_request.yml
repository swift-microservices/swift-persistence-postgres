name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@9a10bfdc569159a3463f1273fbd7ed5f97fbe598  # 0.0.15
    with:
      # Files carry the author header, not a license block; the LICENSE file is the license.
      license_header_check_enabled: false
      docs_check_targets: "PersistencePostgres"

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  static-sdk:
    name: Static Linux Swift SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@d09ffc8ad6437bc278897279e33150d8e39ee3d5  # main as of 2026-10-03; includes Swift 6.4 inputs

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@d09ffc8ad6437bc278897279e33150d8e39ee3d5  # main as of 2026-10-03; includes Swift 6.4 inputs
    with:
      minimum_swift_version: "6.3"
      linux_6_2_enabled: false
