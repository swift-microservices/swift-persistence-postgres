name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@9a10bfdc569159a3463f1273fbd7ed5f97fbe598  # 0.0.15
    with:
      # Files carry the author header, not a license block; the LICENSE file is the license.
      license_header_check_enabled: false
      # Documentation is built without the docc plugin, so the manifest stays lean.
      docs_check_enabled: false

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  static-sdk:
    name: Static Linux Swift SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@21de5f08c1a166a6dd293d0e587ad977bf8dac5d  # 2.103.0

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@21de5f08c1a166a6dd293d0e587ad977bf8dac5d  # 2.103.0
